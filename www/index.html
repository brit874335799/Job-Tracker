<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Job Records</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1024 1024'%3E%3Crect width='1024' height='1024' rx='220' fill='%2314202B'/%3E%3Cpath d='M512 220C512 220 330 440 330 590A182 182 0 0 0 694 590C694 440 512 220 512 220Z' fill='%23F2B90F'/%3E%3Cpath d='M425 598L492 666L604 528' fill='none' stroke='%2314202B' stroke-width='46' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #EDF0F3;
      --surface: #FFFFFF;
      --surface-2: #F6F8FA;
      --border: #D5DCE2;
      --text: #14202B;
      --text-muted: #556370;
      --navy: #14202B;
      --navy-text: #FFFFFF;
      --yellow: #F2B90F;
      --yellow-text: #14202B;
      --yellow-soft: #FEF6DC;
      --yellow-border: #E5B00B;
      --green: #0B7A5C;
      --green-soft: #E5F5F0;
      --red: #C0392B;
      --red-soft: #FDECEB;
      --blue: #1D5B9E;
      --blue-soft: #EAF2FB;
      --shadow: 0 2px 8px rgba(20, 32, 43, 0.08);
      --nav-h: 62px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }

    [data-theme="dark"] {
      --bg: #0D141B;
      --surface: #16222E;
      --surface-2: #1D2C3B;
      --border: #2B3D4F;
      --text: #F0F4F8;
      --text-muted: #9BAAB8;
      --navy: #1E2F40;
      --navy-text: #F5F8FA;
      --yellow: #F2B90F;
      --yellow-text: #14202B;
      --yellow-soft: #332A10;
      --yellow-border: #8A6A08;
      --green: #25B88E;
      --green-soft: #103329;
      --red: #EB5A4B;
      --red-soft: #3B1815;
      --blue: #5EA3ED;
      --blue-soft: #14293F;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: contain;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      touch-action: manipulation;
    }

    .num {
      font-variant-numeric: tabular-nums;
      direction: ltr;
      unicode-bidi: isolate;
      display: inline-block;
    }

    #app {
      min-height: 100vh;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 84px);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
    }

    .page-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bg);
      padding: 12px 14px 8px;
      border-bottom: 1px solid var(--border);
    }

    .page-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .page-title {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .brand-title-wrap {
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }

    .app-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border-radius: 22%;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 1px 4px rgba(20, 32, 43, 0.18);
    }

    .app-logo svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .content {
      padding: 12px 14px;
      max-width: 680px;
      margin: 0 auto;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .hero-card {
      background: #14202B;
      color: #FFFFFF;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 10px;
      border: 1px solid #243647;
    }

    .hero-label {
      font-size: 13px;
      color: #B4C2CF;
      font-weight: 600;
    }

    .hero-profit {
      font-size: 32px;
      font-weight: 800;
      margin: 4px 0 12px;
      letter-spacing: -0.02em;
    }

    .hero-profit.pos { color: #36D3A5; }
    .hero-profit.neg { color: #FF7668; }

    .hero-sub {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.14);
    }

    .hero-sub-label {
      font-size: 12px;
      color: #B4C2CF;
    }

    .hero-sub-val {
      font-size: 17px;
      font-weight: 700;
      color: #FFFFFF;
      margin-top: 2px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 12px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stat-val {
      font-size: 18px;
      font-weight: 800;
      margin-top: 2px;
    }

    .stat-note {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 0 4px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }

    .chip {
      flex: 0 0 auto;
      min-height: 36px;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
    }

    .chip.active {
      background: var(--navy);
      color: var(--navy-text);
      border-color: var(--navy);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid transparent;
    }

    .btn-sm {
      min-height: 36px;
      padding: 6px 11px;
      font-size: 13px;
      border-radius: 8px;
    }

    .btn-block { width: 100%; }

    .btn-primary {
      background: var(--navy);
      color: var(--navy-text);
    }

    .btn-yellow {
      background: var(--yellow);
      color: var(--yellow-text);
      border-color: var(--yellow-border);
    }

    .btn-green {
      background: var(--green);
      color: #FFFFFF;
    }

    .btn-red {
      background: var(--red);
      color: #FFFFFF;
    }

    .btn-outline {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
    }

    .btn-danger-outline {
      background: var(--surface);
      color: var(--red);
      border-color: var(--red);
    }

    .banner {
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .banner-timer {
      background: var(--navy);
      color: #FFFFFF;
      border-color: var(--navy);
    }

    .banner-warn {
      background: var(--yellow-soft);
      border-color: var(--yellow-border);
      color: var(--text);
    }

    .banner-err {
      background: var(--red-soft);
      border-color: var(--red);
      color: var(--red);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
    }

    .badge-done { background: var(--green-soft); color: var(--green); }
    .badge-progress { background: var(--yellow-soft); color: #8A5A00; border: 1px solid var(--yellow-border); }
    [data-theme="dark"] .badge-progress { color: #F5C93D; }
    .badge-planned { background: var(--blue-soft); color: var(--blue); }
    .badge-owes { background: var(--red-soft); color: var(--red); }
    .badge-partly { background: var(--yellow-soft); color: #8A5A00; }
    [data-theme="dark"] .badge-partly { color: #F5C93D; }

    .section-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--text-muted);
      margin: 14px 0 8px;
    }

    .search-wrap {
      position: relative;
      margin: 8px 0;
    }

    .input, select.input, textarea.input {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    .input::placeholder {
      color: var(--text-muted);
      opacity: 0.65;
    }

    .input:focus {
      border-color: var(--navy);
      box-shadow: 0 0 0 2px rgba(20, 32, 43, 0.14);
    }
    [data-theme="dark"] .input:focus {
      border-color: var(--yellow);
      box-shadow: 0 0 0 2px rgba(242, 185, 15, 0.2);
    }

    textarea.input {
      min-height: 76px;
      resize: vertical;
    }

    .field {
      margin-bottom: 12px;
    }

    .field-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 5px;
      color: var(--text);
    }

    .field-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .row-gap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .job-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px;
      margin-bottom: 10px;
    }

    .job-card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .job-customer {
      font-size: 16px;
      font-weight: 800;
    }

    .job-meta {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .job-title-line {
      font-size: 14px;
      font-weight: 600;
      margin-top: 6px;
    }

    .job-time-line {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .job-money-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid var(--border);
      gap: 8px;
    }

    .job-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .profit-pos { color: var(--green); font-weight: 800; }
    .profit-neg { color: var(--red); font-weight: 800; }

    .more-btn {
      min-width: 36px;
      min-height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .list-row:last-child { border-bottom: none; padding-bottom: 2px; }
    .list-row:first-child { padding-top: 2px; }

    .empty-state {
      text-align: center;
      padding: 28px 18px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 12px;
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 10px;
    }

    /* Bottom tab bar */
    #tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 30;
      height: calc(var(--nav-h) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
    }

    .tab-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--text-muted);
      font-size: 10.5px;
      font-weight: 600;
      border-top: 3px solid transparent;
      padding: 4px 2px;
      min-width: 0;
    }

    .tab-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .tab-btn span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .tab-btn.active {
      color: var(--text);
      font-weight: 800;
      border-top-color: var(--yellow);
    }

    #fab-new-job {
      position: fixed;
      bottom: calc(var(--nav-h) + var(--safe-bottom) + 14px);
      inset-inline-end: 16px;
      z-index: 25;
      background: var(--yellow);
      color: var(--yellow-text);
      border: 1px solid var(--yellow-border);
      border-radius: 12px;
      min-height: 48px;
      padding: 0 16px;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(20, 32, 43, 0.24);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #fab-new-job.hidden { display: none; }

    /* Modals / Bottom sheets */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(10, 18, 26, 0.58);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-sheet {
      width: 100%;
      max-width: 680px;
      max-height: 92vh;
      background: var(--surface);
      border-radius: 16px 16px 0 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding-bottom: var(--safe-bottom);
      border-top: 1px solid var(--border);
    }

    .modal-sheet.fullscreen {
      max-height: 100vh;
      max-height: 100dvh;
      height: 100vh;
      height: 100dvh;
      border-radius: 0;
      padding-top: var(--safe-top);
    }

    .modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .modal-title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }

    .modal-body {
      padding: 14px 16px;
      overflow-y: auto;
      flex: 1 1 auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .picker-btn {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: start;
      gap: 8px;
    }

    .picker-row {
      width: 100%;
      min-height: 56px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      text-align: start;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .picker-row:active { background: var(--surface-2); }

    .material-row {
      display: grid;
      grid-template-columns: 1fr 64px 86px 38px;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
    }

    .material-cols-head {
      margin-bottom: 4px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .suggest-box {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      margin-top: 4px;
      overflow: hidden;
    }

    .suggest-item {
      width: 100%;
      text-align: start;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .suggest-item:last-child { border-bottom: none; }

    .summary-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin: 12px 0;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      padding: 3px 0;
    }

    .summary-total {
      border-top: 1px solid var(--border);
      margin-top: 6px;
      padding-top: 8px;
      font-size: 17px;
      font-weight: 800;
    }

    /* Fuel 8-week bars */
    .bar-chart {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      align-items: end;
      height: 126px;
      padding-top: 12px;
    }

    .bar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      min-width: 0;
    }

    .bar-track {
      width: 100%;
      flex: 1 1 auto;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .bar-fill {
      width: 100%;
      max-width: 26px;
      background: var(--navy);
      border-radius: 4px 4px 0 0;
      min-height: 2px;
    }
    [data-theme="dark"] .bar-fill { background: var(--yellow); }

    .bar-amt {
      font-size: 10px;
      font-weight: 700;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .bar-wk {
      font-size: 10px;
      color: var(--text-muted);
    }

    /* Toast */
    #toast-root {
      position: fixed;
      top: calc(var(--safe-top) + 12px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 80;
      width: calc(100% - 28px);
      max-width: 420px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .toast {
      background: var(--navy);
      color: #FFFFFF;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: var(--shadow);
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    /* PIN lock overlay */
    #pin-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #pin-overlay.hidden { display: none; }

    .pin-dots {
      display: flex;
      gap: 14px;
      margin: 18px 0;
    }

    .pin-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--navy);
    }
    [data-theme="dark"] .pin-dot { border-color: var(--yellow); }
    .pin-dot.filled { background: var(--navy); }
    [data-theme="dark"] .pin-dot.filled { background: var(--yellow); }

    .pin-pad {
      display: grid;
      grid-template-columns: repeat(3, 74px);
      gap: 12px;
      margin-top: 8px;
    }

    .pin-key {
      height: 58px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 22px;
      font-weight: 700;
    }
    .pin-key:active { background: var(--surface-2); }

    .link-btn {
      color: var(--blue);
      font-weight: 700;
      text-decoration: underline;
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 4px 0;
    }

    .seg-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 12px 0;
    }

    const CURRENCIES = { ILS: '₪', USD: '$', EUR: '€', GBP: '£' };

    function curSymbol() {
      const code = state && state.settings && state.settings.currency;
      return CURRENCIES[code] || '₪';
    }

    function distLabel() {
      const u = (state && state.settings && state.settings.distanceUnit === 'mi') ? 'mi' : 'km';
      const lang = (state && state.settings && state.settings.language) || 'en';
      return (I18N[lang] && I18N[lang].distShort && I18N[lang].distShort[u]) || u;
    }

    function t(key, vars) {
      const lang = (state && state.settings && state.settings.language) || 'en';
      const parts = key.split('.');
      let cur = I18N[lang] || I18N.en;
      for (const p of parts) {
        if (cur && Object.prototype.hasOwnProperty.call(cur, p)) cur = cur[p];
        else { cur = null; break; }
      }
      if (cur == null) {
        cur = I18N.en;
        for (const p of parts) {
          if (cur && Object.prototype.hasOwnProperty.call(cur, p)) cur = cur[p];
          else { cur = key; break; }
        }
      }
      if (typeof cur !== 'string') return String(cur);
      const merged = Object.assign({ cur: curSymbol(), unit: distLabel() }, vars || {});
      return cur.replace(/\{(\w+)\}/g, (_, k) => (merged[k] !== undefined ? String(merged[k]) : '{' + k + '}'));
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function round2(n) {
      const x = Number(n);
      if (!Number.isFinite(x)) return 0;
      return Math.round((x + Number.EPSILON) * 100) / 100;
    }

    function fmtMoney(n) {
      const val = round2(n);
      const sym = curSymbol();
      const abs = Math.abs(val).toFixed(2);
      return (val < 0 ? '-' + sym : sym) + abs;
    }

    function todayStr() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function parseDateLocal(str) {
      if (!str || typeof str !== 'string') return null;
      const m = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (!m) return null;
      return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), 12, 0, 0, 0);
    }

    function startOfWeekSunday(ref) {
      const d = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate(), 0, 0, 0, 0);
      d.setDate(d.getDate() - d.getDay());
      return d;
    }

    function dateInPeriod(dateStr, period) {
      if (period === 'all') return true;
      const d = parseDateLocal(dateStr);
      if (!d) return false;
      const now = new Date();
      if (period === 'week') {
        const s = startOfWeekSunday(now);
        const e = new Date(s);
        e.setDate(e.getDate() + 7);
        return d >= s && d < e;
      }
      if (period === 'month') {
        return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
      }
      if (period === 'year') {
        return d.getFullYear() === now.getFullYear();
      }
      return true;
    }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function defaultState() {
      return {
        version: CURRENT_VERSION,
        customers: [],
        products: [],
        jobs: [],
        fuel: [],
        mileageLogs: [],
        settings: {
          perKm: 1,
          currency: 'ILS',
          distanceUnit: 'km',
          startingMileage: null,
          startingMileageDate: null,
          businessName: '',
          businessPhone: '',
          language: 'en',
          pinHash: null,
          lastBackup: null,
          theme: 'auto'
        }
      };
    }

    function migrateData(raw, options) {
      const opts = options || {};
      const base = defaultState();
      if (!raw || typeof raw !== 'object') return base;
      const s = raw.settings && typeof raw.settings === 'object' ? raw.settings : {};
      const hasStartM = s.startingMileage !== null && s.startingMileage !== undefined && s.startingMileage !== '' && Number.isFinite(Number(s.startingMileage)) && Number(s.startingMileage) >= 0;
      const startingMileage = hasStartM ? round2(Number(s.startingMileage)) : null;
      const startingMileageDate = typeof s.startingMileageDate === 'string' && s.startingMileageDate
        ? s.startingMileageDate
        : (startingMileage !== null ? todayStr() : null);
      base.settings = {
        perKm: Number.isFinite(Number(s.perKm)) && Number(s.perKm) >= 0 ? Number(s.perKm) : 1,
        currency: CURRENCIES[s.currency] ? s.currency : 'ILS',
        distanceUnit: s.distanceUnit === 'mi' ? 'mi' : 'km',
        startingMileage,
        startingMileageDate,
        businessName: typeof s.businessName === 'string' ? s.businessName : '',
        businessPhone: typeof s.businessPhone === 'string' ? s.businessPhone : '',
        language: s.language === 'he' ? 'he' : 'en',
        pinHash: opts.stripPin ? null : (typeof s.pinHash === 'string' ? s.pinHash : null),
        lastBackup: typeof s.lastBackup === 'string' ? s.lastBackup : null,
        theme: (s.theme === 'light' || s.theme === 'dark') ? s.theme : 'auto'
      };
      if (Array.isArray(raw.customers)) {
        base.customers = raw.customers.filter(Boolean).map(c => ({
          id: c.id || uid(),
          name: String(c.name || ''),
          phone: String(c.phone || ''),
          address: String(c.address || ''),
          notes: String(c.notes || ''),
          cars: Array.isArray(c.cars) ? c.cars.filter(Boolean).map(car => ({
            id: car.id || uid(),
            makeModel: String(car.makeModel || car['make/model'] || ''),
            year: String(car.year || ''),
            plate: String(car.plate || '')
          })) : []
        }));
      }
      if (Array.isArray(raw.products)) {
        base.products = raw.products.filter(Boolean).map(p => ({
          id: p.id || uid(),
          name: String(p.name || ''),
          cost: round2(p.cost),
          unit: String(p.unit || '')
        }));
      }
      if (Array.isArray(raw.jobs)) {
        base.jobs = raw.jobs.filter(Boolean).map(j => {
          const status = (j.status === 'planned' || j.status === 'in_progress' || j.status === 'done') ? j.status : 'done';
          const km = Number.isFinite(Number(j.km)) ? Math.max(0, Number(j.km)) : 0;
          const rate = Number.isFinite(Number(j.rate)) ? Number(j.rate) : base.settings.perKm;
          const gas = Number.isFinite(Number(j.gas)) ? round2(j.gas) : round2(km * rate);
          const hasPaid = j.paid !== null && j.paid !== undefined && j.paid !== '';
          const paid = hasPaid ? round2(j.paid) : null;
          const hasReceived = j.received !== null && j.received !== undefined && j.received !== '';
          const received = hasReceived ? round2(j.received) : (paid !== null ? paid : null);
          const carObj = j.car && typeof j.car === 'object' ? {
            makeModel: String(j.car.makeModel || j.car['make/model'] || ''),
            year: String(j.car.year || ''),
            plate: String(j.car.plate || '')
          } : { makeModel: '', year: '', plate: '' };
          return {
            id: j.id || uid(),
            status,
            date: typeof j.date === 'string' && j.date ? j.date : todayStr(),
            customerId: j.customerId || '',
            customerNameSnapshot: typeof j.customerNameSnapshot === 'string' ? j.customerNameSnapshot : '',
            car: carObj,
            title: String(j.title || ''),
            paid,
            received,
            km,
            rate,
            gas,
            other: Number.isFinite(Number(j.other)) ? round2(j.other) : 0,
            items: Array.isArray(j.items) ? j.items.filter(Boolean).map(it => ({
              name: String(it.name || ''),
              qty: Number.isFinite(Number(it.qty)) ? Number(it.qty) : 1,
              cost: round2(it.cost)
            })) : [],
            notes: String(j.notes || ''),
            time: Array.isArray(j.time) ? j.time.filter(Boolean).map(seg => ({
              type: (seg.type === 'to' || seg.type === 'back' || seg.type === 'site') ? seg.type : 'site',
              start: seg.start,
              end: seg.end || null
            })) : []
          };
        });
      }
      if (Array.isArray(raw.fuel)) {
        base.fuel = raw.fuel.filter(Boolean).map(f => {
          const total = round2(f.total);
          const ppl = round2(f.pricePerLiter);
          const liters = ppl > 0 ? round2(total / ppl) : round2(f.liters);
          const distance = Number.isFinite(Number(f.distance)) && Number(f.distance) > 0 ? round2(f.distance) : 0;
          const hasOdo = f.odometer !== null && f.odometer !== undefined && f.odometer !== '' && Number.isFinite(Number(f.odometer)) && Number(f.odometer) >= 0;
          const odometer = hasOdo ? round2(Number(f.odometer)) : null;
          return {
            id: f.id || uid(),
            date: typeof f.date === 'string' && f.date ? f.date : todayStr(),
            total,
            pricePerLiter: ppl,
            liters,
            distance,
            odometer,
            note: String(f.note || '')
          };
        });
      }
      if (Array.isArray(raw.mileageLogs)) {
        base.mileageLogs = raw.mileageLogs.filter(Boolean).map(m => {
          const reading = Number.isFinite(Number(m.reading)) && Number(m.reading) >= 0 ? round2(Number(m.reading)) : 0;
          return {
            id: m.id || uid(),
            date: typeof m.date === 'string' && m.date ? m.date : todayStr(),
            reading,
            note: String(m.note || '')
          };
        });
      }
      return base;
    }

    let state = defaultState();
    let storageErrorMsg = '';

    function loadState() {
      try {
        let rawStr = localStorage.getItem(STORAGE_KEY);
        if (!rawStr) rawStr = localStorage.getItem(LEGACY_STORAGE_KEY);
        if (!rawStr) {
          state = defaultState();
          return;
        }
        const parsed = JSON.parse(rawStr);
        state = migrateData(parsed);
      } catch (e) {
        storageErrorMsg = t('loadError');
        state = defaultState();
      }
    }

    function saveState() {
      try {
        state.version = CURRENT_VERSION;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        storageErrorMsg = '';
        return true;
      } catch (e) {
        storageErrorMsg = t('saveError');
        showToast(t('saveError'));
        return false;
      }
    }

    function getCustomerById(id) {
      return state.customers.find(c => c.id === id) || null;
    }

    function getCustomerName(job) {
      const c = getCustomerById(job.customerId);
      if (c) return c.name;
      return job.customerNameSnapshot || t('unknownCustomer');
    }

    function formatCar(car) {
      if (!car) return '';
      const parts = [car.makeModel, car.year, car.plate].map(x => String(x || '').trim()).filter(Boolean);
      return parts.join(' · ');
    }

    function jobHasPrice(job) {
      return job.paid !== null && job.paid !== undefined && job.paid !== '' && Number.isFinite(Number(job.paid));
    }

    function getEffectiveReceived(job) {
      if (!jobHasPrice(job)) return 0;
      const paid = round2(job.paid);
      if (job.received === null || job.received === undefined || job.received === '') return paid;
      return round2(job.received);
    }

    function getPaymentStatus(job) {
      if (job.status === 'done' && !jobHasPrice(job)) return 'unpriced';
      const paid = round2(job.paid || 0);
      if (paid <= 0) return 'paid';
      const rec = getEffectiveReceived(job);
      if (rec <= 0) return 'not_paid';
      if (rec < paid - 0.005) return 'partly_paid';
      return 'paid';
    }

    function calcJob(job) {
      const paid = jobHasPrice(job) ? round2(job.paid) : 0;
      const received = getEffectiveReceived(job);
      const owed = job.status === 'done' ? Math.max(0, round2(paid - received)) : 0;
      const materials = round2((job.items || []).reduce((acc, it) => acc + (Number(it.qty || 0) * Number(it.cost || 0)), 0));
      const gas = round2(job.gas || 0);
      const other = round2(job.other || 0);
      const expenses = round2(materials + gas + other);
      const profit = round2(paid - expenses);
      return { paid, received, owed, materials, gas, other, expenses, profit, hasPrice: jobHasPrice(job) };
    }

    function segMs(seg, nowMs) {
      const s = Date.parse(seg.start);
      const e = seg.end ? Date.parse(seg.end) : (nowMs || Date.now());
      if (!Number.isFinite(s) || !Number.isFinite(e)) return 0;
      return Math.max(0, e - s);
    }

    function calcJobTime(job, nowMs) {
      let toMs = 0, siteMs = 0, backMs = 0;
      let runningSeg = null;
      for (const seg of (job.time || [])) {
        const ms = segMs(seg, nowMs);
        if (seg.type === 'to') toMs += ms;
        else if (seg.type === 'back') backMs += ms;
        else siteMs += ms;
        if (!seg.end) runningSeg = seg;
      }
      const drivingMs = toMs + backMs;
      const totalMs = siteMs + drivingMs;
      return { toMs, siteMs, backMs, drivingMs, totalMs, runningSeg };
    }

    function fmtDur(ms) {
      const totalMin = Math.floor(Math.max(0, ms) / 60000);
      const h = Math.floor(totalMin / 60);
      const m = totalMin % 60;
      if (state.settings.language === 'he') {
        if (h > 0) return h + ' ש׳ ' + m + ' ד׳';
        return m + ' ד׳';
      }
      if (h > 0) return h + 'h ' + m + 'm';
      return m + 'm';
    }

    function fmtLiveTimer(ms) {
      const sec = Math.floor(Math.max(0, ms) / 1000);
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    async function hashPinWithSalt(salt, pin) {
      const str = salt + String(pin);
      if (window.crypto && window.crypto.subtle) {
        try {
          const buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
          return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        } catch (e) {}
      }
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return 'fb_' + (h >>> 0).toString(16);
    }

    async function hashPin(pin) {
      return hashPinWithSalt('jobrecords_salt_', pin);
    }

    async function pinMatches(pin, storedHash) {
      if (!storedHash) return false;
      if ((await hashPinWithSalt('jobrecords_salt_', pin)) === storedHash) return true;
      return (await hashPinWithSalt('jobledger_salt_', pin)) === storedHash;
    }

    function applyThemeAndLang() {
      const lang = state.settings.language === 'he' ? 'he' : 'en';
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
      document.title = t('appTitle');
      const pref = state.settings.theme || 'auto';
      let isDark = pref === 'dark';
      if (pref === 'auto' && window.matchMedia) {
        isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      }
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    }

    function showToast(msg, actionLabel, actionFn) {
      const root = document.getElementById('toast-root');
      const el = document.createElement('div');
      el.className = 'toast';
      const span = document.createElement('span');
      span.textContent = msg;
      el.appendChild(span);
      if (actionLabel && actionFn) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn btn-sm btn-yellow';
        b.textContent = actionLabel;
        b.onclick = () => {
          actionFn();
          el.remove();
        };
        el.appendChild(b);
      }
      root.appendChild(el);
      setTimeout(() => { if (el.parentNode) el.remove(); }, 3400);
    }
    let ui = {
      tab: 'home',
      homePeriod: 'month',
      jobsFilter: 'done',
      jobsSearch: '',
      customersSearch: '',
      selectedCustomerId: null,
      customerJobsSearch: '',
      fuelPeriod: 'month',
      lastTimerUndo: null,
      lastUndoTapMs: 0,
      warned12hJobId: null
    };

    const modalStack = [];

    function getRunningJob() {
      for (const j of state.jobs) {
        for (const seg of (j.time || [])) {
          if (!seg.end) return { job: j, seg };
        }
      }
      return null;
    }

    function saveTimerUndoSnapshot(jobId, prevStatus, prevTime) {
      ui.lastTimerUndo = {
        jobId,
        prevStatus,
        prevTime: JSON.parse(JSON.stringify(prevTime || []))
      };
    }

    function undoLastTimerStep() {
      const now = Date.now();
      if (now - ui.lastUndoTapMs < 1000) return;
      ui.lastUndoTapMs = now;
      if (!ui.lastTimerUndo) return;
      const snap = ui.lastTimerUndo;
      const job = state.jobs.find(j => j.id === snap.jobId);
      if (!job) {
        ui.lastTimerUndo = null;
        return;
      }
      job.status = snap.prevStatus;
      job.time = snap.prevTime;
      ui.lastTimerUndo = null;
      saveState();
      render();
    }

    function startJobTimer(jobId, segType) {
      const job = state.jobs.find(j => j.id === jobId);
      if (!job) return;
      if (!job.customerId) {
        showAlert(t('needCustomerTimer'));
        return;
      }
      const running = getRunningJob();
      if (running && running.job.id !== job.id) {
        const label = getCustomerName(running.job) + (running.job.title ? ' — ' + running.job.title : '');
        showModal({
          title: t('timerAlreadyRunningTitle'),
          bodyHtml: '<p style="margin:0">' + esc(t('timerAlreadyRunningBody', { job: label })) + '</p>',
          buttons: [
            { text: t('cancel'), cls: 'btn-outline', onClick: closeTopModal },
            { text: t('openRunningJob'), cls: 'btn-primary', onClick: () => { closeTopModal(); openJobModal(running.job.id); } }
          ]
        });
        return;
      }
      if (running && running.job.id === job.id) return;
      saveTimerUndoSnapshot(job.id, job.status, job.time);
      job.status = 'in_progress';
      if (!Array.isArray(job.time)) job.time = [];
      job.time.push({ type: segType || 'site', start: new Date().toISOString(), end: null });
      saveState();
      render();
      showToast(t('timerRunning'), t('undo'), undoLastTimerStep);
    }

    function stopJobTimer(jobId) {
      const job = state.jobs.find(j => j.id === jobId);
      if (!job) return;
      const runningSeg = (job.time || []).find(s => !s.end);
      if (!runningSeg) return;
      saveTimerUndoSnapshot(job.id, job.status, job.time);
      runningSeg.end = new Date().toISOString();
      saveState();
      render();
      showToast(t('stop'), t('undo'), undoLastTimerStep);
    }

    function arrivedAtJob(jobId) {
      const job = state.jobs.find(j => j.id === jobId);
      if (!job) return;
      saveTimerUndoSnapshot(job.id, job.status, job.time);
      const nowIso = new Date().toISOString();
      for (const s of (job.time || [])) {
        if (!s.end) s.end = nowIso;
      }
      job.time.push({ type: 'site', start: nowIso, end: null });
      job.status = 'in_progress';
      saveState();
      render();
      showToast(t('onSite'), t('undo'), undoLastTimerStep);
    }

    function finishJobAction(jobId) {
      const job = state.jobs.find(j => j.id === jobId);
      if (!job) return;
      saveTimerUndoSnapshot(job.id, job.status, job.time);
      const nowIso = new Date().toISOString();
      for (const s of (job.time || [])) {
        if (!s.end) s.end = nowIso;
      }
      job.status = 'done';
      saveState();
      render();
      showModal({
        title: t('addPaymentPromptTitle'),
        bodyHtml: '<p style="margin:0">' + esc(t('addPaymentPromptBody')) + '</p>',
        buttons: [
          { text: t('later'), cls: 'btn-outline', onClick: closeTopModal },
          { text: t('openJobForm'), cls: 'btn-primary', onClick: () => { closeTopModal(); openJobModal(job.id); } }
        ]
      });

    function checkOver12hTimer() {
      const r = getRunningJob();
      if (!r) { ui.warned12hJobId = null; return; }
      const elapsed = Date.now() - Date.parse(r.seg.start);
      if (elapsed > 12 * 3600 * 1000 && ui.warned12hJobId !== r.job.id) {
        ui.warned12hJobId = r.job.id;
        const label = getCustomerName(r.job) + (r.job.title ? ' — ' + r.job.title : '');
        showModal({
          title: t('timer12hTitle'),
          bodyHtml: '<p style="margin:0">' + esc(t('timer12hBody', { job: label })) + '</p>',
          buttons: [
            { text: t('later'), cls: 'btn-outline', onClick: closeTopModal },
            { text: t('openJobForm'), cls: 'btn-primary', onClick: () => { closeTopModal(); openJobModal(r.job.id); } }
          ]
        });
      }
    }

    function isBackupStale() {
      if (!state.settings.lastBackup) return true;
      const ts = Date.parse(state.settings.lastBackup);
      if (!Number.isFinite(ts)) return true;
      return (Date.now() - ts) > 14 * 24 * 3600 * 1000;
    }

    function fmtOdometer(n) {
      const val = round2(n);
      return Number.isInteger(val) ? val.toLocaleString('en-US') : val.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    }

    function daysBetweenDates(fromStr, toStr) {
      const a = parseDateLocal(fromStr);
      const b = parseDateLocal(toStr);
      if (!a || !b) return 0;
      return Math.round((b.getTime() - a.getTime()) / 86400000);
    }

    function collectRawOdometerPoints() {
      const pts = [];
      for (const m of (state.mileageLogs || [])) {
        pts.push({
          id: m.id,
          sourceType: 'log',
          date: m.date || '',
          reading: round2(m.reading),
          note: m.note || ''
        });
      }
      for (const f of (state.fuel || [])) {
        if (f.odometer !== null && f.odometer !== undefined && Number.isFinite(Number(f.odometer))) {
          pts.push({
            id: f.id,
            sourceType: 'fuel',
            date: f.date || '',
            reading: round2(f.odometer),
            note: f.note || ''
          });
        }
      }
      return pts.sort((a, b) => {
        const dc = (a.date || '').localeCompare(b.date || '');
        if (dc !== 0) return dc;
        const rc = a.reading - b.reading;
        if (rc !== 0) return rc;
        return String(a.id || '').localeCompare(String(b.id || ''));
      });
    }

    function getSortedMileageEntries() {
      const sorted = collectRawOdometerPoints();
      const startM = (state.settings.startingMileage !== null && state.settings.startingMileage !== undefined)
        ? round2(state.settings.startingMileage) : null;
      return sorted.map((m, idx) => {
        const reading = round2(m.reading);
        let prevReading = null;
        let hasBaseline = false;
        let baselineTag = null;
        if (idx === 0) {
          if (startM !== null) {
            prevReading = startM;
            hasBaseline = true;
            baselineTag = 'settings';
          }
        } else {
          prevReading = round2(sorted[idx - 1].reading);
          hasBaseline = true;
          baselineTag = sorted[idx - 1].date || 'log';
        }
        const driven = hasBaseline ? Math.max(0, round2(reading - prevReading)) : 0;
        return {
          id: m.id,
          sourceType: m.sourceType,
          date: m.date,
          reading,
          note: m.note || '',
          prevReading,
          hasBaseline,
          baselineTag,
          driven
        };
      });
    }

    function getMileageBaselineFor(excludeId, dateStr, excludeType) {
      const typeToExclude = excludeType || 'log';
      const targetDate = dateStr || todayStr();
      const earlier = collectRawOdometerPoints()
        .filter(m => !(excludeId && m.id === excludeId && m.sourceType === typeToExclude))
        .filter(m => (m.date || '') <= targetDate);
      if (earlier.length > 0) {
        const prev = earlier[earlier.length - 1];
        return { prevReading: round2(prev.reading), source: 'log', date: prev.date || '' };
      }
      if (state.settings.startingMileage !== null && state.settings.startingMileage !== undefined) {
        return { prevReading: round2(state.settings.startingMileage), source: 'settings', date: state.settings.startingMileageDate || '' };
      }
      return { prevReading: null, source: 'none', date: '' };
    }

    function getMileageDueInfo() {
      const entries = getSortedMileageEntries();
      const today = todayStr();
      if (entries.length > 0) {
        const last = entries[entries.length - 1];
        const days = daysBetweenDates(last.date, today);
        return {
          due: days >= 7,
          needsSetup: false,
          daysSince: Math.max(0, days),
          lastReading: last.reading,
          lastDate: last.date
        };
      }
      if (state.settings.startingMileage !== null && state.settings.startingMileage !== undefined) {
        const refDate = state.settings.startingMileageDate || today;
        const days = daysBetweenDates(refDate, today);
        return {
          due: days >= 7,
          needsSetup: false,
          daysSince: Math.max(0, days),
          lastReading: round2(state.settings.startingMileage),
          lastDate: refDate
        };
      }
      return {
        due: false,
        needsSetup: true,
        daysSince: null,
        lastReading: null,
        lastDate: null
      };
    }

    function getFilteredJobs() {
      const q = ui.jobsSearch.trim().toLowerCase();
      const list = state.jobs.filter(j => {
        if (j.status !== ui.jobsFilter) return false;
        if (!q) return true;
        const cust = getCustomerName(j).toLowerCase();
        const title = (j.title || '').toLowerCase();

    function customerStats(custId) {
      const jobs = state.jobs.filter(j => j.customerId === custId);
      const done = jobs.filter(j => j.status === 'done');
      let profit = 0, owed = 0, siteMs = 0, timed = 0, lastDate = '';
      for (const j of done) {
        const c = calcJob(j);
        profit = round2(profit + c.profit);
        owed = round2(owed + c.owed);
        if (j.date && (!lastDate || j.date > lastDate)) lastDate = j.date;
        const tm = calcJobTime(j);
        if (tm.siteMs > 0) { siteMs += tm.siteMs; timed++; }
      }
      return { totalJobs: jobs.length, doneCount: done.length, profit, owed, avgSiteMs: timed > 0 ? siteMs / timed : 0, lastDate };
    }

    function renderFuel() {
      const chips = ['week', 'month', 'all'].map(p =>
        `<button type="button" class="chip ${ui.fuelPeriod === p ? 'active' : ''}" data-fuel-period="${p}">${esc(t('periods.' + p))}</button>`
      ).join('');

      const filtered = state.fuel.filter(f => dateInPeriod(f.date, ui.fuelPeriod));
      let spent = 0, liters = 0;
      for (const f of filtered) {
        spent = round2(spent + (f.total || 0));
        liters = round2(liters + (f.liters || 0));
      }
      const weightedAvg = liters > 0 ? round2(spent / liters) : 0;

      const allMileage = getSortedMileageEntries();
      const filteredMileage = allMileage.filter(m => dateInPeriod(m.date, ui.fuelPeriod));
      const periodDist = round2(filteredMileage.reduce((acc, m) => acc + (m.hasBaseline ? m.driven : 0), 0));
      const avgCostPerDist = (periodDist > 0 && spent > 0) ? round2(spent / periodDist) : 0;
      const latestMileage = allMileage.length > 0 ? allMileage[allMileage.length - 1] : null;
      const mInfo = getMileageDueInfo();

      // Last 8 weeks bars (Sunday start)
      const now = new Date();
      const thisSun = startOfWeekSunday(now);
      const weeks = [];
      for (let i = 7; i >= 0; i--) {
        const ws = new Date(thisSun);
        ws.setDate(ws.getDate() - i * 7);
        const we = new Date(ws);
        we.setDate(we.getDate() + 7);
        let wTotal = 0;
        for (const f of state.fuel) {
          const d = parseDateLocal(f.date);
          if (d && d >= ws && d < we) wTotal = round2(wTotal + f.total);
        }
        const label = (ws.getMonth() + 1) + '/' + ws.getDate();
        weeks.push({ label, total: wTotal });
      }
      const maxWk = Math.max(1, ...weeks.map(w => w.total));

      const sortedFuel = [...state.fuel].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      const newestMileage = [...allMileage].reverse();
      const sym = curSymbol();
      const dUnit = distLabel();

      return `
        <div class="page-header">
          <div class="page-header-row">
            <h1 class="page-title">${esc(t('tabs.fuel'))}</h1>
            <button type="button" class="btn btn-sm btn-yellow" id="btn-add-fuel">+ ${esc(t('addFillup'))}</button>
          </div>
          <div class="chips" style="margin-top:8px">${chips}</div>
        </div>
        <div class="content">
          ${mInfo.due ? `
            <div class="banner banner-warn">
              <span style="font-size:13px;font-weight:700">${esc(t('mileageWeeklyReminder', { days: mInfo.daysSince }))}</span>
              <button type="button" class="btn btn-sm btn-yellow" id="fuel-mileage-btn">${esc(t('updateMileageBtn'))}</button>
            </div>` : (mInfo.needsSetup ? `
            <div class="banner banner-warn">
              <span style="font-size:13px;font-weight:700">${esc(t('mileageSetupHint'))}</span>
              <button type="button" class="btn btn-sm btn-outline" id="fuel-goto-settings">${esc(t('goToSettings'))}</button>
            </div>` : '')}

          <div class="grid-2">
            <div class="stat-box">
              <div class="stat-label">${esc(t('totalSpent'))}</div>
              <div class="stat-val num">${esc(fmtMoney(spent))}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">${esc(t('litersLabel'))}</div>
              <div class="stat-val num">${liters.toFixed(2)} L</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">${esc(t('fillupsCount'))}</div>
              <div class="stat-val num">${filtered.length}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">${esc(t('avgPricePerLiter'))}</div>
              <div class="stat-val num">${liters > 0 ? esc(fmtMoney(weightedAvg)) : '—'}</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">${esc(t('distanceDrivenLabel'))}</div>
              <div class="stat-val num">${periodDist > 0 ? esc(periodDist.toFixed(1) + ' ' + dUnit) : '—'}</div>
              ${latestMileage ? `<div class="stat-note"><span class="num">${esc(fmtOdometer(latestMileage.reading) + ' ' + dUnit)}</span></div>` : ''}
            </div>
            <div class="stat-box">
              <div class="stat-label">${esc(t('avgCostPerDist'))}</div>
              <div class="stat-val num">${avgCostPerDist > 0 ? esc(fmtMoney(avgCostPerDist) + '/' + dUnit) : '—'}</div>
              ${periodDist > 0 ? `<div class="stat-note">${esc(t('basedOnMileage', { dist: periodDist.toFixed(1) }))}</div>` : ''}
            </div>
          </div>

          <div class="card">
            <div style="font-size:13px;font-weight:800;margin-bottom:4px">${esc(t('last8Weeks'))}</div>
            <div class="bar-chart">
              ${weeks.map(w => {
                const hPct = Math.round((w.total / maxWk) * 100);
                return `
                  <div class="bar-col">
                    <div class="bar-track"><div class="bar-fill" style="height:${Math.max(2, hPct)}%"></div></div>
                    <div class="bar-amt num">${w.total > 0 ? esc(sym) + Math.round(w.total) : '0'}</div>
                    <div class="bar-wk">${esc(w.label)}</div>
                  </div>`;
              }).join('')}
            </div>
          </div>

          <div class="section-title">${esc(t('odometerLogTitle'))}</div>
          ${newestMileage.length === 0 ? `<div class="empty-state">${esc(t('odometerEmpty'))}</div>` : `
            <div class="card">
              ${newestMileage.map(m => `
                <div class="list-row" ${m.sourceType === 'fuel' ? `data-edit-fuel="${esc(m.id)}"` : `data-edit-mileage="${esc(m.id)}"`}>
                  <div style="min-width:0;flex:1">
                    <div style="font-weight:800">
                      ${esc(m.date)} · <span class="num">${esc(fmtOdometer(m.reading) + ' ' + dUnit)}</span>
                      ${m.sourceType === 'fuel' ? `<span class="badge" style="background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border);margin-inline-start:6px">${esc(t('fillupTag'))}</span>` : ''}
                    </div>
                    <div style="font-size:12px;color:var(--text-muted)">
                      ${m.hasBaseline ? esc(t('drivenAmountLine', { dist: m.driven.toFixed(1) })) : esc(t('baselineEntry'))}
                      ${m.note ? ' · ' + esc(m.note) : ''}
                    </div>
                  </div>
                  <div class="num" style="font-weight:800;color:${m.hasBaseline ? 'var(--green)' : 'var(--text-muted)'}">
                    ${m.hasBaseline ? '+' + esc(m.driven.toFixed(1)) + ' ' + esc(dUnit) : esc(fmtOdometer(m.reading))}
                  </div>
                </div>`).join('')}
              ${state.settings.startingMileage !== null && state.settings.startingMileage !== undefined ? `
                <div style="font-size:12px;color:var(--text-muted);padding-top:8px;border-top:1px solid var(--border);margin-top:4px">
                  ${esc(t('startingMileageRef', { val: fmtOdometer(state.settings.startingMileage) }))}
                </div>` : ''}
            </div>`}

          <div class="section-title">${esc(t('fillupsCount'))}</div>
          ${sortedFuel.length === 0 ? `<div class="empty-state">${esc(t('fuelEmpty'))}</div>` : `
            <div class="card">
              ${sortedFuel.map(f => `
                <div class="list-row" data-edit-fuel="${esc(f.id)}">
                  <div style="min-width:0;flex:1">
                    <div style="font-weight:800">${esc(f.date)}</div>
                    <div style="font-size:12px;color:var(--text-muted)">
                      <span class="num">${Number(f.liters).toFixed(2)} L</span> · <span class="num">${esc(fmtMoney(f.pricePerLiter))}/L</span>
                      ${f.odometer != null ? ` · <span class="num">${esc(fmtOdometer(f.odometer) + ' ' + dUnit)}</span>` : ''}
                      ${f.note ? ' · ' + esc(f.note) : ''}
                    </div>
                  </div>
                  <div class="num" style="font-weight:800">${esc(fmtMoney(f.total))}</div>
                </div>`).join('')}
            </div>`}
        </div>`;
    }

    function showModal(opts) {
      const root = document.getElementById('modal-root');
      const backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      const sheet = document.createElement('div');
      sheet.className = 'modal-sheet' + (opts.fullscreen ? ' fullscreen' : '');

      const header = document.createElement('div');
      header.className = 'modal-header';
      const h2 = document.createElement('h2');
      h2.className = 'modal-title';
      h2.textContent = opts.title || '';
      const closeBtn = document.createElement('button');
      closeBtn.type = 'button';
      closeBtn.className = 'btn btn-sm btn-ghost';
      closeBtn.style.fontSize = '20px';
      closeBtn.textContent = '✕';
      closeBtn.onclick = () => closeTopModal();
      header.appendChild(h2);
      header.appendChild(closeBtn);
      sheet.appendChild(header);

      const body = document.createElement('div');
      body.className = 'modal-body';
      if (typeof opts.bodyHtml === 'string') body.innerHTML = opts.bodyHtml;
      sheet.appendChild(body);

      let footer = null;
      if (Array.isArray(opts.buttons) && opts.buttons.length) {
        footer = document.createElement('div');
        footer.className = 'modal-footer';
        for (const b of opts.buttons) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'btn ' + (b.cls || 'btn-outline');
          btn.style.flex = b.flex || '1';
          btn.textContent = b.text;
          btn.onclick = () => b.onClick && b.onClick({ backdrop, body, footer });
          footer.appendChild(btn);
        }
        sheet.appendChild(footer);
      }

      backdrop.appendChild(sheet);
      backdrop.addEventListener('click', e => {
        if (e.target === backdrop && !opts.noBackdropClose) closeTopModal();
      });
      root.appendChild(backdrop);

      const entry = { backdrop, onClose: opts.onClose || null };
      modalStack.push(entry);
      try { history.pushState({ jlModal: modalStack.length }, ''); } catch (e) {}
      if (opts.onMount) opts.onMount({ backdrop, body, footer });
      return entry;
    }

    let ignoreNextPopCount = 0;

    function closeTopModal(fromPopState) {
      const entry = modalStack.pop();
      if (!entry) return false;
      if (entry.backdrop && entry.backdrop.parentNode) entry.backdrop.remove();
      if (entry.onClose) entry.onClose();
      if (!fromPopState) {
        try {
          if (history.state && history.state.jlModal) {
            ignoreNextPopCount++;
            history.back();
          }
        } catch (e) {}
      }
      return true;
    }

    window.addEventListener('popstate', () => {
      if (ignoreNextPopCount > 0) {
        ignoreNextPopCount--;
        return;
      }
      if (modalStack.length > 0) {
        closeTopModal(true);
      } else if (ui.tab === 'customers' && ui.selectedCustomerId) {
        ui.selectedCustomerId = null;
        render();
      }
    });

    function toLocalDatetimeInput(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return '';
      const p = n => String(n).padStart(2, '0');
      return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
    }
