    function buildPastTitleSuggestions() {
      const seen = new Map();
      for (let i = state.jobs.length - 1; i >= 0; i--) {
        const title = (state.jobs[i].title || '').trim();
        if (title && !seen.has(title.toLowerCase())) seen.set(title.toLowerCase(), title);
      }
      return Array.from(seen.values());
    }

    function buildPastItemSuggestions() {
      const map = new Map();
      const sorted = [...state.jobs].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      for (const j of sorted) {
        for (const it of (j.items || [])) {
          const name = (it.name || '').trim();
          if (name && !map.has(name.toLowerCase())) {
            map.set(name.toLowerCase(), { name, cost: round2(it.cost) });
          }
        }
      }
      return Array.from(map.values());
    }

    function buildReceiptText(job) {
      const c = calcJob(job);
      const custName = getCustomerName(job);
      const carStr = formatCar(job.car);
      const lines = [];
      if (state.settings.businessName) lines.push(state.settings.businessName);
      if (state.settings.businessPhone) lines.push(state.settings.businessPhone);
      if (lines.length) lines.push('---');
      lines.push(t('receiptTitle'));
      lines.push(t('dateLabel') + ': ' + (job.date || todayStr()));
      lines.push(t('receiptCustomer') + ': ' + custName);
      if (carStr) lines.push(t('receiptCar') + ': ' + carStr);
      if (job.title) lines.push(t('receiptWork') + ': ' + job.title);
      if (job.items && job.items.length) {
        lines.push('');
        lines.push(t('receiptMaterials') + ':');
        for (const it of job.items) {
          const lineTotal = round2((Number(it.qty) || 0) * (Number(it.cost) || 0));
          lines.push('• ' + it.name + ' × ' + it.qty + ' — ' + fmtMoney(lineTotal));
        }
      }
      lines.push('');
      lines.push(t('receiptTotal') + ': ' + fmtMoney(c.paid));
      lines.push(t('receiptReceived') + ': ' + fmtMoney(c.received));
      if (c.owed > 0) lines.push(t('receiptOwed') + ': ' + fmtMoney(c.owed));
      else lines.push(t('receiptPaidInFull'));
      return lines.join('\n');
    }

    async function shareReceipt(job) {
      const text = buildReceiptText(job);
      const title = (state.settings.businessName || t('appTitle')) + ' — ' + t('receiptTitle');
      try {
        if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && window.Capacitor.Plugins && window.Capacitor.Plugins.Share) {
          await window.Capacitor.Plugins.Share.share({ title, text, dialogTitle: t('sendReceipt') });
          return;
        }
        if (navigator.share) {
          await navigator.share({ title, text });
          return;
        }
      } catch (e) {
        if (e && String(e.name) === 'AbortError') return;
      }
      showModal({
        title: t('sendReceipt'),
        bodyHtml: `<textarea class="input" id="rcp-text" readonly style="min-height:210px">${esc(text)}</textarea>`,
        buttons: [
          { text: t('close'), cls: 'btn-outline', onClick: closeTopModal },
          {
            text: t('copyText'),
            cls: 'btn-primary',
            onClick: async () => {
              try { await navigator.clipboard.writeText(text); showToast(t('receiptCopied')); } catch (e) {}
              closeTopModal();
            }
          }
        ]
      });
    }

    function openJobModal(jobId, opts) {
      const options = opts || {};
      const existing = jobId ? state.jobs.find(j => j.id === jobId) : null;
      const isPlan = !existing && !!options.planned;

      const draft = existing ? JSON.parse(JSON.stringify(existing)) : {
        id: uid(),
        status: isPlan ? 'planned' : 'done',
        date: todayStr(),
        customerId: options.customerId || '',
        customerNameSnapshot: '',
        car: { makeModel: '', year: '', plate: '' },
        title: '',
        paid: null,
        received: null,
        km: 0,
        rate: state.settings.perKm,
        gas: 0,
        other: 0,
        items: [],
        notes: '',
        time: []
      };

      const origKm = existing ? Number(existing.km || 0) : null;
      const origRate = existing ? Number(existing.rate != null ? existing.rate : state.settings.perKm) : state.settings.perKm;

      const titleSuggestions = buildPastTitleSuggestions();
      const itemSuggestions = buildPastItemSuggestions();

      const modalTitle = existing ? t('jobFormEdit') : (isPlan ? t('jobFormPlan') : t('jobFormNew'));

      const buttons = [
        { text: t('cancel'), cls: 'btn-outline', onClick: closeTopModal }
      ];
      if (existing) {
        buttons.push({
          text: t('sendReceipt'),
          cls: 'btn-outline',
          onClick: () => shareReceipt(draft)
        });
        buttons.push({
          text: t('delete'),
          cls: 'btn-danger-outline',
          onClick: () => {
            showConfirm(t('confirmDelete'), () => {
              state.jobs = state.jobs.filter(j => j.id !== existing.id);
              if (ui.lastTimerUndo && ui.lastTimerUndo.jobId === existing.id) ui.lastTimerUndo = null;
              saveState();
              closeTopModal();
              render();
              showToast(t('jobDeleted'));
            });
          }
        });
      }
      buttons.push({
        text: t('save'),
        cls: 'btn-primary',
        onClick: ({ body }) => {
          if (!draft.customerId) {
            showAlert(t('customerRequired'));
            return;
          }
          const cust = getCustomerById(draft.customerId);
          draft.customerNameSnapshot = cust ? cust.name : draft.customerNameSnapshot;
          draft.status = body.querySelector('#jf-status').value;
          draft.date = body.querySelector('#jf-date').value || todayStr();
          draft.title = body.querySelector('#jf-title').value.trim();
          draft.notes = body.querySelector('#jf-notes').value.trim();

          const paidRaw = body.querySelector('#jf-paid').value.trim();
          const recRaw = body.querySelector('#jf-received').value.trim();
          draft.paid = paidRaw === '' ? null : round2(Math.max(0, Number(paidRaw) || 0));
          if (draft.paid === null) {
            draft.received = recRaw === '' ? null : round2(Math.max(0, Number(recRaw) || 0));
          } else {
            draft.received = recRaw === '' ? 0 : round2(Math.max(0, Number(recRaw) || 0));
          }

          const newKm = Math.max(0, Number(body.querySelector('#jf-km').value) || 0);
          if (existing && newKm === origKm) {
            draft.rate = origRate;
            draft.gas = existing.gas != null ? round2(existing.gas) : round2(newKm * origRate);
          } else {
            draft.rate = state.settings.perKm;
            draft.gas = round2(newKm * draft.rate);
          }
          draft.km = newKm;
          draft.other = round2(Math.max(0, Number(body.querySelector('#jf-other').value) || 0));

          // Save new car to customer if requested
          const carSel = body.querySelector('#jf-car-select');
          if (carSel && carSel.value === '__new__') {
            const mm = body.querySelector('#jf-car-mm').value.trim();
            const yr = body.querySelector('#jf-car-yr').value.trim();
            const pl = body.querySelector('#jf-car-pl').value.trim();
            draft.car = { makeModel: mm, year: yr, plate: pl };
            if (cust && (mm || yr || pl)) {
              cust.cars = cust.cars || [];
              cust.cars.push({ id: uid(), makeModel: mm, year: yr, plate: pl });
            }
          }

          // Clean empty items
          draft.items = (draft.items || []).filter(it => it.name.trim() !== '').map(it => ({
            name: it.name.trim(),
            qty: Number(it.qty) || 0,
            cost: round2(it.cost)
          }));

          if (existing) {
            const idx = state.jobs.findIndex(j => j.id === existing.id);
            if (idx >= 0) state.jobs[idx] = draft;
          } else {
            state.jobs.push(draft);
          }
          saveState();
          closeTopModal();
          render();
          showToast(t('jobSaved'));
        }
      });

      showModal({
        title: modalTitle,
        fullscreen: true,
        bodyHtml: `
          <div class="field">
            <label class="field-label">${esc(t('statusLabel'))}</label>
            <select class="input" id="jf-status">
              <option value="planned" ${draft.status === 'planned' ? 'selected' : ''}>${esc(t('status.planned'))}</option>
              <option value="in_progress" ${draft.status === 'in_progress' ? 'selected' : ''}>${esc(t('status.in_progress'))}</option>
              <option value="done" ${draft.status === 'done' ? 'selected' : ''}>${esc(t('status.done'))}</option>
            </select>
          </div>

          <div class="field">
            <label class="field-label">${esc(t('customerLabel'))}</label>
            <button type="button" class="picker-btn" id="jf-cust-btn">
              <span id="jf-cust-label"></span>
              <span>▾</span>
            </button>
            <div id="jf-cust-links" class="row-gap" style="margin-top:4px"></div>
          </div>

          <div class="field" id="jf-car-wrap">
            <label class="field-label">${esc(t('carLabel'))}</label>
            <select class="input" id="jf-car-select"></select>
            <div id="jf-new-car-fields" style="display:none;margin-top:8px" class="card">
              <div class="field" style="margin-bottom:6px">
                <input type="text" class="input" id="jf-car-mm" placeholder="${esc(t('makeModel'))}" />
              </div>
              <div class="row-gap">
                <input type="text" inputmode="numeric" class="input" id="jf-car-yr" placeholder="${esc(t('year'))}" style="flex:1" />
                <input type="text" class="input" id="jf-car-pl" placeholder="${esc(t('plate'))}" style="flex:1.4" />
              </div>
            </div>
          </div>

          <div class="field">
            <label class="field-label">${esc(t('dateLabel'))}</label>
            <input type="date" class="input" id="jf-date" value="${esc(draft.date)}" />
          </div>

          <div class="field">
            <label class="field-label">${esc(t('whatYouDid'))}</label>
            <input type="text" class="input" id="jf-title" value="${esc(draft.title)}" placeholder="${esc(t('whatYouDidPlaceholder'))}" />
            <div id="jf-title-suggest" class="suggest-box" style="display:none"></div>
          </div>

          <div class="grid-2">
            <div class="field" style="margin-bottom:0">
              <label class="field-label">${esc(t('paidLabel'))}</label>
              <input type="text" inputmode="decimal" class="input" id="jf-paid" placeholder="0.00" value="${draft.paid != null ? esc(draft.paid) : ''}" />
            </div>
            <div class="field" style="margin-bottom:0">
              <label class="field-label">${esc(t('receivedLabel'))}</label>
              <input type="text" inputmode="decimal" class="input" id="jf-received" placeholder="0.00" value="${existing ? (draft.received != null ? esc(draft.received) : (draft.paid != null ? esc(draft.paid) : '')) : ''}" />
            </div>
          </div>
          <div class="row-gap" style="margin:6px 0 12px">
            <span class="badge" id="jf-pay-badge"></span>
            <span class="badge badge-owes" id="jf-owed-badge" style="display:none"></span>
          </div>

          <div class="field">
            <div class="row-between" style="margin-bottom:6px">
              <span class="field-label" style="margin:0">${esc(t('materialsUsed'))}</span>
            </div>
            <div id="jf-items-list"></div>
            <div class="row-gap" style="margin-top:6px">
              <button type="button" class="btn btn-sm btn-outline" id="jf-add-product">${esc(t('addFromProducts'))}</button>
              <button type="button" class="btn btn-sm btn-outline" id="jf-add-other">${esc(t('addOtherItem'))}</button>
            </div>
          </div>

          <div class="grid-2">
            <div class="field" style="margin-bottom:0">
              <label class="field-label">${esc(t('kmLabel'))}</label>
              <input type="text" inputmode="decimal" class="input" id="jf-km" placeholder="0" value="${draft.km > 0 ? esc(draft.km) : ''}" />
            </div>
            <div class="field" style="margin-bottom:0">
              <label class="field-label">${esc(t('otherExpLabel'))}</label>
              <input type="text" inputmode="decimal" class="input" id="jf-other" placeholder="0.00" value="${draft.other > 0 ? esc(draft.other) : ''}" />
            </div>
          </div>

          <div class="divider"></div>
          <div class="field">
            <div class="row-between" style="margin-bottom:6px">
              <span class="field-label" style="margin:0">${esc(t('timeSection'))}</span>
              <div class="row-gap">
                ${existing && existing.status === 'done' && !calcJobTime(draft).runningSeg ? `<button type="button" class="btn btn-sm btn-outline" id="jf-add-drive-back">${esc(t('addDrivingBack'))}</button>` : ''}
                <button type="button" class="btn btn-sm btn-outline" id="jf-add-seg">${esc(t('addTimeSegment'))}</button>
              </div>
            </div>
            <div id="jf-time-summary" style="font-size:13px;margin-bottom:8px"></div>
            <div id="jf-segs-list"></div>
          </div>

          <div class="summary-box" id="jf-live-summary"></div>

          <div class="field">
            <label class="field-label">${esc(t('notes'))}</label>
            <textarea class="input" id="jf-notes">${esc(draft.notes)}</textarea>
          </div>`,
        buttons,
        onMount: ({ body }) => {
          const custLabel = body.querySelector('#jf-cust-label');
          const custLinks = body.querySelector('#jf-cust-links');
          const carSel = body.querySelector('#jf-car-select');
          const newCarBox = body.querySelector('#jf-new-car-fields');
          const titleInp = body.querySelector('#jf-title');
          const titleSugBox = body.querySelector('#jf-title-suggest');
          const paidInp = body.querySelector('#jf-paid');
          const recInp = body.querySelector('#jf-received');
          const kmInp = body.querySelector('#jf-km');
          const otherInp = body.querySelector('#jf-other');

          function refreshCustomerUI() {
            const c = getCustomerById(draft.customerId);
            custLabel.textContent = c ? c.name : (draft.customerNameSnapshot || t('tapToPickCustomer'));
            custLabel.style.color = c ? 'var(--text)' : 'var(--text-muted)';
            custLinks.innerHTML = '';
            if (c && c.phone) {
              const a = document.createElement('a');
              a.className = 'link-btn';
              a.href = 'tel:' + c.phone;
              a.textContent = c.phone + ' (' + t('call') + ')';
              custLinks.appendChild(a);
            }
            if (c && c.address) {
              const b = document.createElement('button');
              b.type = 'button';
              b.className = 'link-btn';
              b.textContent = c.address + ' (' + t('navigate') + ')';
              b.onclick = () => openMapChooser(c.address);
              custLinks.appendChild(b);
            }
            // Cars dropdown
            const cars = c && Array.isArray(c.cars) ? c.cars : [];
            const currentCarStr = formatCar(draft.car);
            carSel.innerHTML = `<option value="">${esc(t('noCarLabel'))}</option>`;
            let matchedIdx = -1;
            cars.forEach((car, i) => {
              const str = formatCar(car);
              if (currentCarStr && str === currentCarStr) matchedIdx = i;
              const opt = document.createElement('option');
              opt.value = String(i);
              opt.textContent = str;
              carSel.appendChild(opt);
            });
            if (currentCarStr && matchedIdx === -1) {
              const optCur = document.createElement('option');
              optCur.value = '__current__';
              optCur.textContent = currentCarStr;
              carSel.appendChild(optCur);
              carSel.value = '__current__';
            } else if (matchedIdx >= 0) {
              carSel.value = String(matchedIdx);
            }
            const optNew = document.createElement('option');
            optNew.value = '__new__';
            optNew.textContent = t('newCarOption');
            carSel.appendChild(optNew);
            newCarBox.style.display = 'none';
          }

          carSel.onchange = () => {
            const c = getCustomerById(draft.customerId);
            if (carSel.value === '__new__') {
              newCarBox.style.display = 'block';
            } else {
              newCarBox.style.display = 'none';
              if (carSel.value === '') draft.car = { makeModel: '', year: '', plate: '' };
              else if (carSel.value !== '__current__' && c && c.cars[Number(carSel.value)]) {
                const chosen = c.cars[Number(carSel.value)];
                draft.car = { makeModel: chosen.makeModel, year: chosen.year, plate: chosen.plate };
              }
            }
          };

          body.querySelector('#jf-cust-btn').onclick = () => {
            openCustomerPicker(cust => {
              draft.customerId = cust.id;
              draft.customerNameSnapshot = cust.name;
              if ((!draft.car || !draft.car.makeModel) && cust.cars && cust.cars.length === 1) {
                draft.car = { makeModel: cust.cars[0].makeModel, year: cust.cars[0].year, plate: cust.cars[0].plate };
              }
              refreshCustomerUI();
            });
          };

          titleInp.addEventListener('input', () => {
            const q = titleInp.value.trim().toLowerCase();
            if (!q) { titleSugBox.style.display = 'none'; return; }
            const hits = titleSuggestions.filter(s => s.toLowerCase().includes(q) && s.toLowerCase() !== q).slice(0, 4);
            if (!hits.length) { titleSugBox.style.display = 'none'; return; }
            titleSugBox.style.display = 'block';
            titleSugBox.innerHTML = hits.map(h => `<button type="button" class="suggest-item">${esc(h)}</button>`).join('');
            titleSugBox.querySelectorAll('button').forEach((btn, idx) => {
              btn.onclick = () => { titleInp.value = hits[idx]; titleSugBox.style.display = 'none'; };
            });
          });

          function renderItems() {
            const listEl = body.querySelector('#jf-items-list');
            listEl.innerHTML = '';
            if (draft.items && draft.items.length > 0) {
              const head = document.createElement('div');
              head.className = 'material-row material-cols-head';
              head.innerHTML = `<span>${esc(t('itemCol'))}</span><span>${esc(t('qtyCol'))}</span><span>${esc(t('unitCostCol'))}</span><span></span>`;
              listEl.appendChild(head);
            }
            (draft.items || []).forEach((it, idx) => {
              const wrap = document.createElement('div');
              wrap.style.marginBottom = '8px';
              const qtyVal = (it.qty === '' || it.qty === null || it.qty === undefined) ? '' : String(it.qty);
              const costVal = (it.cost === '' || it.cost === null || it.cost === undefined) ? '' : String(it.cost);
              wrap.innerHTML = `
                <div class="material-row">
                  <input type="text" class="input it-name" placeholder="${esc(t('itemCol'))}" value="${esc(it.name)}" />
                  <input type="text" inputmode="decimal" class="input it-qty" placeholder="${esc(t('qtyCol'))}" value="${esc(qtyVal)}" />
                  <input type="text" inputmode="decimal" class="input it-cost" placeholder="${esc(t('itemCostPlaceholder'))}" value="${esc(costVal)}" />
                  <button type="button" class="btn btn-sm btn-danger-outline it-rm">✕</button>
                </div>
                <div class="suggest-box it-sug" style="display:none"></div>`;
              const nInp = wrap.querySelector('.it-name');
              const qInp = wrap.querySelector('.it-qty');
              const cInp = wrap.querySelector('.it-cost');
              const sugBox = wrap.querySelector('.it-sug');

              nInp.oninput = () => {
                draft.items[idx].name = nInp.value;
                const q = nInp.value.trim().toLowerCase();
                if (!q) { sugBox.style.display = 'none'; return; }
                const hits = itemSuggestions.filter(s => s.name.toLowerCase().includes(q) && s.name.toLowerCase() !== q).slice(0, 4);
                if (!hits.length) { sugBox.style.display = 'none'; return; }
                sugBox.style.display = 'block';
                sugBox.innerHTML = hits.map(h => `<button type="button" class="suggest-item"><span>${esc(h.name)}</span><span class="num">${esc(fmtMoney(h.cost))}</span></button>`).join('');
                sugBox.querySelectorAll('button').forEach((b, hi) => {
                  b.onclick = () => {
                    draft.items[idx].name = hits[hi].name;
                    draft.items[idx].cost = hits[hi].cost;
                    nInp.value = hits[hi].name;
                    cInp.value = hits[hi].cost;
                    sugBox.style.display = 'none';
                    updateSummary();
                  };
                });
              };
              qInp.oninput = () => { draft.items[idx].qty = qInp.value.trim() === '' ? '' : (Number(qInp.value) || 0); updateSummary(); };
              cInp.oninput = () => { draft.items[idx].cost = cInp.value.trim() === '' ? '' : (Number(cInp.value) || 0); updateSummary(); };
              wrap.querySelector('.it-rm').onclick = () => { draft.items.splice(idx, 1); renderItems(); updateSummary(); };
              listEl.appendChild(wrap);
            });
          }

          body.querySelector('#jf-add-other').onclick = () => {
            draft.items.push({ name: '', qty: '', cost: '' });
            renderItems();
            updateSummary();
          };

          body.querySelector('#jf-add-product').onclick = () => {
            const prods = [...state.products].sort((a, b) => a.name.localeCompare(b.name));
            showModal({
              title: t('pickProduct'),
              bodyHtml: prods.length === 0 ? `<div class="empty-state">${esc(t('noProductsToPick'))}</div>` : prods.map(p => `
                <button type="button" class="picker-row" data-prod-id="${esc(p.id)}">
                  <div class="row-between" style="width:100%">
                    <span style="font-weight:700">${esc(p.name)}${p.unit ? ' (' + esc(p.unit) + ')' : ''}</span>
                    <span class="num" style="font-weight:800">${esc(fmtMoney(p.cost))}</span>
                  </div>
                </button>`).join(''),
              buttons: [{ text: t('cancel'), cls: 'btn-outline', onClick: closeTopModal }],
              onMount: ({ body: pb }) => {
                pb.querySelectorAll('[data-prod-id]').forEach(btn => {
                  btn.onclick = () => {
                    const p = state.products.find(x => x.id === btn.dataset.prodId);
                    if (p) {
                      draft.items.push({ name: p.name, qty: 1, cost: round2(p.cost) });
                      renderItems();
                      updateSummary();
                    }
                    closeTopModal();
                  };
                });
              }
            });
          };

          function renderTimeSection() {
            const sumEl = body.querySelector('#jf-time-summary');
            const listEl = body.querySelector('#jf-segs-list');
            const tm = calcJobTime(draft);
            const parts = [];
            parts.push('<strong>' + esc(t('onSite')) + ':</strong> <span class="num">' + esc(fmtDur(tm.siteMs)) + '</span>');
            if (tm.toMs > 0) parts.push('<strong>' + esc(t('drivingThere')) + ':</strong> <span class="num">' + esc(fmtDur(tm.toMs)) + '</span>');
            if (tm.backMs > 0) parts.push('<strong>' + esc(t('drivingBack')) + ':</strong> <span class="num">' + esc(fmtDur(tm.backMs)) + '</span>');
            parts.push('<strong>' + esc(t('totalTime')) + ':</strong> <span class="num">' + esc(fmtDur(tm.totalMs)) + '</span>');
            sumEl.innerHTML = parts.join(' · ');

            listEl.innerHTML = '';
            (draft.time || []).forEach((seg, idx) => {
              const label = seg.type === 'to' ? t('drivingThere') : (seg.type === 'back' ? t('drivingBack') : t('onSite'));
              const sD = new Date(seg.start);
              const eD = seg.end ? new Date(seg.end) : null;
              const sStr = Number.isNaN(sD.getTime()) ? '' : sD.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
              const eStr = eD && !Number.isNaN(eD.getTime()) ? eD.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : t('segRunning');
              const row = document.createElement('div');
              row.className = 'seg-card';
              row.innerHTML = `
                <div style="flex:1;min-width:0" data-edit-seg>
                  <div style="font-weight:700;font-size:13px">${esc(label)} · <span class="num">${esc(fmtDur(segMs(seg)))}</span></div>
                  <div class="num" style="font-size:12px;color:var(--text-muted)">${esc(sStr)} – ${esc(eStr)}</div>
                </div>
                <button type="button" class="btn btn-sm btn-danger-outline">✕</button>`;
              row.querySelector('[data-edit-seg]').onclick = () => {
                openSegmentModal(seg, updated => {
                  draft.time[idx] = updated;
                  renderTimeSection();
                  updateSummary();
                });
              };
              row.querySelector('button').onclick = () => {
                draft.time.splice(idx, 1);
                renderTimeSection();
                updateSummary();
              };
              listEl.appendChild(row);
            });
          }

          body.querySelector('#jf-add-seg').onclick = () => {
            openSegmentModal(null, created => {
              draft.time = draft.time || [];
              draft.time.push(created);
              renderTimeSection();
              updateSummary();
            });
          };

          const driveBackBtn = body.querySelector('#jf-add-drive-back');
          if (driveBackBtn && existing) {
            driveBackBtn.onclick = () => {
              closeTopModal();
              startJobTimer(existing.id, 'back');
            };
          }

          function updateSummary() {
            const paidRaw = paidInp.value.trim();
            const recRaw = recInp.value.trim();
            const paidVal = paidRaw === '' ? null : round2(Math.max(0, Number(paidRaw) || 0));
            const recVal = paidVal === null ? null : (recRaw === '' ? 0 : round2(Math.max(0, Number(recRaw) || 0)));

            const payBadge = body.querySelector('#jf-pay-badge');
            const owedBadge = body.querySelector('#jf-owed-badge');
            const st = getPaymentStatus({ status: body.querySelector('#jf-status').value, paid: paidVal, received: recVal });
            payBadge.textContent = t('payStatus.' + st);
            payBadge.className = 'badge ' + (st === 'paid' ? 'badge-done' : (st === 'not_paid' ? 'badge-owes' : 'badge-partly'));
            const owedPreview = paidVal !== null ? Math.max(0, round2(paidVal - (recVal || 0))) : 0;
            if (owedPreview > 0) {
              owedBadge.style.display = 'inline-flex';
              owedBadge.textContent = t('owesAmt', { amt: fmtMoney(owedPreview) });
            } else {
              owedBadge.style.display = 'none';
            }

            const kmVal = Math.max(0, Number(kmInp.value) || 0);
            const useRate = (existing && kmVal === origKm) ? origRate : state.settings.perKm;
            const gasVal = (existing && kmVal === origKm && existing.gas != null) ? round2(existing.gas) : round2(kmVal * useRate);
            const matVal = round2((draft.items || []).reduce((a, it) => a + (Number(it.qty || 0) * Number(it.cost || 0)), 0));
            const otherVal = round2(Math.max(0, Number(otherInp.value) || 0));
            const profitVal = round2((paidVal || 0) - (matVal + gasVal + otherVal));

            const tm = calcJobTime(draft);
            const hrs = tm.totalMs / 3600000;

            body.querySelector('#jf-live-summary').innerHTML = `
              <div class="summary-line"><span>${esc(t('paidLabel'))}</span><span class="num">${esc(fmtMoney(paidVal || 0))}</span></div>
              <div class="summary-line"><span>− ${esc(t('materialsLine'))}</span><span class="num">${esc(fmtMoney(matVal))}</span></div>
              <div class="summary-line"><span>− ${esc(t('gasLine', { km: kmVal, rate: useRate }))}</span><span class="num">${esc(fmtMoney(gasVal))}</span></div>
              <div class="summary-line"><span>− ${esc(t('otherLine'))}</span><span class="num">${esc(fmtMoney(otherVal))}</span></div>
              <div class="summary-line summary-total">
                <span>${esc(t('profitLine'))}</span>
                <span class="num ${profitVal >= 0 ? 'profit-pos' : 'profit-neg'}">${esc(fmtMoney(profitVal))}</span>
              </div>
              ${hrs > 0 ? `<div class="summary-line" style="font-size:12px;color:var(--text-muted)"><span>${esc(t('profitPerHour'))}</span><span class="num">${esc(fmtMoney(profitVal / hrs))}</span></div>` : ''}`;
          }

          paidInp.addEventListener('input', updateSummary);
          recInp.addEventListener('input', updateSummary);
          kmInp.addEventListener('input', updateSummary);
          otherInp.addEventListener('input', updateSummary);
          body.querySelector('#jf-status').addEventListener('change', updateSummary);

          refreshCustomerUI();
          renderItems();
          renderTimeSection();
          updateSummary();
        }
      });
    }

    function openOwedModal() {
      const map = new Map();
      for (const j of state.jobs) {
        if (j.status !== 'done') continue;
        const c = calcJob(j);
        if (c.owed <= 0) continue;
        const cust = getCustomerById(j.customerId);
        const key = j.customerId || ('n:' + getCustomerName(j));
        if (!map.has(key)) {
          map.set(key, { id: j.customerId, name: getCustomerName(j), phone: cust ? cust.phone : '', owed: 0 });
        }
        map.get(key).owed = round2(map.get(key).owed + c.owed);
      }
      const list = Array.from(map.values()).sort((a, b) => b.owed - a.owed);
      showModal({
        title: t('owedListTitle'),
        bodyHtml: list.length === 0 ? `<div class="empty-state">${esc(t('noMoneyOwed'))}</div>` : list.map(item => `
          <div class="list-row">
            <div style="min-width:0;flex:1">
              <div style="font-weight:800">${esc(item.name)}</div>
              ${item.phone ? `<a class="link-btn" href="tel:${esc(item.phone)}">${esc(item.phone)}</a>` : ''}
            </div>
            <div class="row-gap">
              <span class="num profit-neg">${esc(fmtMoney(item.owed))}</span>
              ${item.id ? `<button type="button" class="btn btn-sm btn-outline" data-jump-cust="${esc(item.id)}">›</button>` : ''}
            </div>
          </div>`).join(''),
        buttons: [{ text: t('close'), cls: 'btn-primary', onClick: closeTopModal }],
        onMount: ({ body }) => {
          body.querySelectorAll('[data-jump-cust]').forEach(b => {
            b.onclick = () => {
              closeTopModal();
              ui.tab = 'customers';
              ui.selectedCustomerId = b.dataset.jumpCust;
              render();
            };
          });
        }
      });
    }

    function openProductModal(prodId) {
      const existing = prodId ? state.products.find(p => p.id === prodId) : null;
      const buttons = [
        { text: t('cancel'), cls: 'btn-outline', onClick: closeTopModal },
        {
          text: t('save'),
          cls: 'btn-primary',
          onClick: ({ body }) => {
            const name = body.querySelector('#pf-name').value.trim();
            if (!name) return;
            const cost = round2(Math.max(0, Number(body.querySelector('#pf-cost').value) || 0));
            const unit = body.querySelector('#pf-unit').value.trim();
            if (existing) {
              existing.name = name; existing.cost = cost; existing.unit = unit;
            } else {
              state.products.push({ id: uid(), name, cost, unit });
            }
            saveState();
            closeTopModal();
            render();
          }
        }
      ];
      if (existing) {
        buttons.unshift({
          text: t('delete'),
          cls: 'btn-danger-outline',
          onClick: () => {
            showConfirm(t('confirmDelete'), () => {
              state.products = state.products.filter(p => p.id !== existing.id);
              saveState();
              closeTopModal();
              render();
            });
          }
        });
      }
      showModal({
        title: existing ? t('editProduct') : t('addProduct'),
        bodyHtml: `
          <div class="field">
            <label class="field-label">${esc(t('productName'))}</label>
            <input type="text" class="input" id="pf-name" placeholder="${esc(t('productNamePlaceholder'))}" value="${esc(existing ? existing.name : '')}" />
          </div>
          <div class="field">
            <label class="field-label">${esc(t('productCost'))}</label>
            <input type="text" inputmode="decimal" class="input" id="pf-cost" placeholder="${esc(t('itemCostPlaceholder'))}" value="${existing ? esc(existing.cost) : ''}" />
          </div>

    async function writeAndNotifyFile(defaultBaseName, ext, content, mimeType, isBackup) {
      showModal({
        title: t('fileNamePromptTitle'),

    async function performFileSave(fileName, content, mimeType, isBackup) {
      const cap = window.Capacitor;
      const isNative = !!(cap && cap.isNativePlatform && cap.isNativePlatform());
      const FS = cap && cap.Plugins && cap.Plugins.Filesystem;
      const Share = cap && cap.Plugins && cap.Plugins.Share;

      if (isNative && FS) {
        try {
          const res = await FS.writeFile({
            path: 'JobRecords/' + fileName,
            data: content,
            directory: 'DOCUMENTS',
            encoding: 'utf8',
            recursive: true
          });
          if (isBackup) {
            state.settings.lastBackup = new Date().toISOString();
            saveState();
            render();
          }
          const uri = res && res.uri ? res.uri : null;
          showModal({
            title: t('savedModalTitle'),
            bodyHtml: '<p style="margin:0;font-weight:700">' + esc(t('savedModalNative', { name: fileName })) + '</p>',
            buttons: [
              {
                text: t('shareSendTo'),
                cls: 'btn-outline',
                onClick: async () => {
                  if (Share) {
                    try {
                      let shareUri = uri;
                      if (!shareUri) {
                        const u = await FS.getUri({ path: 'JobRecords/' + fileName, directory: 'DOCUMENTS' });
                        shareUri = u && u.uri;
                      }
                      await Share.share({ title: fileName, files: shareUri ? [shareUri] : undefined, text: shareUri ? undefined : content, dialogTitle: fileName });
                    } catch (e) {}
                  }
                }
              },
              { text: t('ok'), cls: 'btn-primary', onClick: closeTopModal }
            ]
          });
          return;
        } catch (err) {
          // Automatic fallback to Cache + Android Share sheet
          let cacheUri = null;
          try {
            const cRes = await FS.writeFile({ path: fileName, data: content, directory: 'CACHE', encoding: 'utf8' });
            cacheUri = cRes && cRes.uri;
          } catch (e2) {}
          showAlert(t('savedFallbackNative', { err: err && err.message ? err.message : 'Storage error' }));
          if (Share) {
            try {
              await Share.share({ title: fileName, files: cacheUri ? [cacheUri] : undefined, text: cacheUri ? undefined : content, dialogTitle: fileName });
              if (isBackup) {
                state.settings.lastBackup = new Date().toISOString();
                saveState();
                render();
              }
            } catch (e3) {}
          }
          return;
        }
      }

      // Web browser fallback
      try {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        if (isBackup) {
          state.settings.lastBackup = new Date().toISOString();
          saveState();
          render();
        }
        showModal({
          title: t('savedModalTitle'),
          bodyHtml: '<p style="margin:0;font-weight:700">' + esc(t('savedModalWeb', { name: fileName })) + '</p>',
          buttons: [
            {
              text: t('shareSendTo'),
              cls: 'btn-outline',
              onClick: async () => {
                try {
                  const file = new File([content], fileName, { type: mimeType });
                  if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ title: fileName, files: [file] });
                  } else if (navigator.share) {
                    await navigator.share({ title: fileName, text: content });
                  }
                } catch (e) {}
              }
            },
            { text: t('ok'), cls: 'btn-primary', onClick: closeTopModal }
          ]
        });
      } catch (e) {
        showAlert(t('saveError'));
      }
    }

        const backMin = tm.backMs > 0 ? Math.round(tm.backMs / 60000) : '';

        rows.push([

    function handleRestoreFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result || ''));
          if (!parsed || typeof parsed !== 'object' || (!Array.isArray(parsed.jobs) && !Array.isArray(parsed.customers))) {
            showAlert(t('restoreInvalid'));
            return;
          }
          const migrated = migrateData(parsed, { stripPin: true });
          const savedDate = parsed.exportedAt ? new Date(parsed.exportedAt).toLocaleString() : '—';
          showModal({
            title: t('restorePreviewTitle'),
            bodyHtml: '<p style="margin:0;white-space:pre-line">' + esc(t('restorePreviewBody', {
              date: savedDate,
              c: migrated.customers.length,
              p: migrated.products.length,
              j: migrated.jobs.length,
              f: migrated.fuel.length
            })) + '</p>',
            buttons: [
              { text: t('cancel'), cls: 'btn-outline', onClick: closeTopModal },
              {
                text: t('restoreConfirm'),
                cls: 'btn-primary',
                onClick: () => {
                  try { localStorage.setItem(UNDO_RESTORE_KEY, JSON.stringify(state)); } catch (e) {}
                  migrated.settings.pinHash = state.settings.pinHash; // keep active device lock if set? wait: restoring on new phone has pinHash=null; keeping current pinHash or null: spec says "Backups include all app data ... but NOT the PIN hash, so restoring on a new phone never locks me out." So migrated already has pinHash: null!
                  state = migrated;
                  saveState();
                  applyThemeAndLang();
                  closeTopModal();
                  render();
                  showToast(t('restoreDone'));
                }
              }
            ]
          });
        } catch (e) {
          showAlert(t('restoreInvalid'));
        }
      };
      reader.readAsText(file);
    }

            ${[0,1,2,3].map(i => `<div class="pin-dot ${i < entry.length ? 'filled' : ''}"></div>`).join('')}
          </div>
          <div style="min-height:20px;color:var(--red);font-size:13px;font-weight:700">${esc(errMsg)}</div>
          <div class="pin-pad">
            ${[1,2,3,4,5,6,7,8,9].map(n => `<button type="button" class="pin-key" data-k="${n}">${n}</button>`).join('')}
            ${mode !== 'unlock' ? `<button type="button" class="pin-key" data-k="cancel" style="font-size:14px">${esc(t('cancel'))}</button>` : '<div></div>'}
            <button type="button" class="pin-key" data-k="0">0</button>
            <button type="button" class="pin-key" data-k="del">⌫</button>
          </div>`;

        overlay.querySelectorAll('[data-k]').forEach(btn => {
          btn.onclick = async () => {
            const k = btn.dataset.k;
            if (k === 'cancel') { overlay.classList.add('hidden'); return; }
            if (k === 'del') { entry = entry.slice(0, -1); errMsg = ''; draw(); return; }
            if (entry.length >= 4) return;
            entry += k;
            draw();
            if (entry.length === 4) {
              if (step === 'unlock') {
                if (await pinMatches(entry, state.settings.pinHash)) {
                  pinLocked = false;
                  overlay.classList.add('hidden');
                  if (onComplete) onComplete(true);
                } else {
                  entry = ''; errMsg = t('pinWrong'); draw();
                }
              } else if (step === 'new1') {
                firstPin = entry; entry = ''; step = 'new2'; errMsg = ''; draw();
              } else if (step === 'new2') {
                if (entry === firstPin) {
                  state.settings.pinHash = await hashPin(entry);
                  saveState();
                  overlay.classList.add('hidden');
                  render();
                  showToast(t('pinSaved'));
                } else {
                  entry = ''; firstPin = ''; step = 'new1'; errMsg = t('pinMismatch'); draw();
                }
              } else if (step === 'remove') {
                if (await pinMatches(entry, state.settings.pinHash)) {
                  state.settings.pinHash = null;
                  saveState();
                  overlay.classList.add('hidden');
                  render();
                  showToast(t('pinRemoved'));
                } else {
                  entry = ''; errMsg = t('pinWrong'); draw();
                }
              }
            }
          };
        });
      }
      draw();
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        lastHiddenAt = Date.now();
      } else {
        if (state.settings.pinHash && !pinLocked && lastHiddenAt > 0 && (Date.now() - lastHiddenAt) > 60000) {
          pinLocked = true;
          showPinPad('unlock');
        }
        updateLiveTimers();
        checkOver12hTimer();
      }
    });

    function renderTabs() {
      const icons = {
        home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
        jobs: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>',
        customers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 20c0-3.5 3.1-6 7-6s7 2.5 7 6"/><circle cx="17" cy="9" r="3"/><path d="M18 14c2.4.5 4 2.3 4 5"/></svg>',
        products: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3.3 7.3L12 12l8.7-4.7M12 12v10"/></svg>',
        fuel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v15"/><path d="M2 20h15M7 8h5M15 10l3-2v8a2 2 0 0 0 4 0V8l-2-2"/></svg>',
        settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'
      };
      const bar = document.getElementById('tab-bar');
      bar.innerHTML = ['home', 'jobs', 'customers', 'products', 'fuel', 'settings'].map(k =>
        `<button type="button" class="tab-btn ${ui.tab === k ? 'active' : ''}" data-tab="${k}">${icons[k]}<span>${esc(t('tabs.' + k))}</span></button>`
      ).join('');
      bar.querySelectorAll('[data-tab]').forEach(b => {
        b.onclick = () => {
          ui.tab = b.dataset.tab;
          if (ui.tab !== 'customers') ui.selectedCustomerId = null;
          render();
          window.scrollTo(0, 0);
        };
      });

      const fab = document.getElementById('fab-new-job');
      fab.textContent = '+ ' + t('newJob');
      if (ui.tab === 'home' || ui.tab === 'jobs') fab.classList.remove('hidden');
      else fab.classList.add('hidden');
    }

    function render() {
      applyThemeAndLang();
      const app = document.getElementById('app');
      if (ui.tab === 'home') app.innerHTML = renderHome();
      else if (ui.tab === 'jobs') app.innerHTML = renderJobs();
      else if (ui.tab === 'customers') {
        app.innerHTML = renderCustomers();
        if (ui.selectedCustomerId) renderCustomerJobsListOnly(ui.selectedCustomerId);
        else renderCustomersListOnly();
      }
      else if (ui.tab === 'products') app.innerHTML = renderProducts();
      else if (ui.tab === 'fuel') app.innerHTML = renderFuel();
      else if (ui.tab === 'settings') app.innerHTML = renderSettings();
      renderTabs();
      bindTabEvents();
    }

    function bindTabEvents() {
      const app = document.getElementById('app');

      // Search inputs (no focus loss!)
      const jobsSearch = app.querySelector('#jobs-search-input');
      if (jobsSearch) {
        jobsSearch.oninput = () => { ui.jobsSearch = jobsSearch.value; renderJobsListOnly(); };
      }
      const custSearch = app.querySelector('#customers-search-input');
      if (custSearch) {
        custSearch.oninput = () => { ui.customersSearch = custSearch.value; renderCustomersListOnly(); };
      }
      const custJobsSearch = app.querySelector('#cust-jobs-search');
      if (custJobsSearch) {
        custJobsSearch.oninput = () => { ui.customerJobsSearch = custJobsSearch.value; renderCustomerJobsListOnly(ui.selectedCustomerId); };
      }

      // Settings direct bindings
      const perKmInp = app.querySelector('#set-per-km');
      if (perKmInp) {
        perKmInp.onchange = () => {
          const val = Number(perKmInp.value);
          if (Number.isFinite(val) && val >= 0) {
            state.settings.perKm = round2(val);
            saveState();
          }
        };
      }
      const startMileageInp = app.querySelector('#set-starting-mileage');
      if (startMileageInp) {
        startMileageInp.oninput = () => {
          const raw = startMileageInp.value.trim();
          if (raw === '') {
            state.settings.startingMileage = null;
            state.settings.startingMileageDate = null;
            saveState();
            return;
          }
          const val = Number(raw);
          if (Number.isFinite(val) && val >= 0) {
            state.settings.startingMileage = round2(val);
            if (!state.settings.startingMileageDate) state.settings.startingMileageDate = todayStr();
            saveState();
          }
        };
      }
      const bizName = app.querySelector('#set-biz-name');
      if (bizName) bizName.oninput = () => { state.settings.businessName = bizName.value; saveState(); };
      const bizPhone = app.querySelector('#set-biz-phone');
      if (bizPhone) bizPhone.oninput = () => { state.settings.businessPhone = bizPhone.value; saveState(); };

      const restoreInput = app.querySelector('#restore-file-input');
      if (restoreInput) {
        restoreInput.onchange = () => {
          if (restoreInput.files && restoreInput.files[0]) handleRestoreFile(restoreInput.files[0]);
          restoreInput.value = '';
        };
      }
    }

    // Global click delegation inside #app
    document.getElementById('app').addEventListener('click', e => {
      const target = e.target;
      if (target.closest('a')) return;

      const btn = target.closest('button, [data-card-job], [data-open-job], [data-open-customer], [data-edit-product], [data-edit-fuel], [data-edit-mileage], [data-open-running]');
      if (!btn) return;

      if (btn.id === 'home-backup-btn' || btn.id === 'settings-backup-now' || btn.id === 'btn-save-backup') { exportBackupJson(); return; }
      if (btn.id === 'btn-export-jobs-csv') { exportJobsCsv(); return; }
      if (btn.id === 'btn-export-fuel-csv') { exportFuelCsv(); return; }
      if (btn.id === 'btn-restore-backup') { document.getElementById('restore-file-input').click(); return; }
      if (btn.id === 'btn-undo-restore') {
        try {
          const prev = localStorage.getItem(UNDO_RESTORE_KEY);
          if (prev) {
            state = migrateData(JSON.parse(prev));
            localStorage.removeItem(UNDO_RESTORE_KEY);
            saveState();
            render();
            showToast(t('restoreUndone'));
          }
        } catch (err) {}
        return;
      }
      if (btn.id === 'btn-set-pin') { showPinPad('new1'); return; }
      if (btn.id === 'btn-remove-pin') { showPinPad('remove'); return; }
      if (btn.id === 'home-owed-card') { openOwedModal(); return; }
      if (btn.id === 'btn-plan-job') { openJobModal(null, { planned: true }); return; }
      if (btn.id === 'btn-add-customer') { openCustomerModal(null); return; }
      if (btn.id === 'cust-back-btn') { ui.selectedCustomerId = null; ui.customerJobsSearch = ''; render(); return; }
      if (btn.id === 'cust-edit-btn') { openCustomerModal(ui.selectedCustomerId); return; }
      if (btn.id === 'cust-plan-job-btn') { openJobModal(null, { planned: true, customerId: ui.selectedCustomerId }); return; }
      if (btn.id === 'btn-add-product') { openProductModal(null); return; }
      if (btn.id === 'btn-add-fuel') { openFuelModal(null); return; }
      if (btn.id === 'btn-add-mileage' || btn.id === 'home-mileage-btn' || btn.id === 'fuel-mileage-btn') { openMileageModal(null); return; }
      if (btn.id === 'fuel-goto-settings') { ui.tab = 'settings'; render(); window.scrollTo(0, 0); return; }

      if (btn.dataset.homePeriod) { ui.homePeriod = btn.dataset.homePeriod; render(); return; }
      if (btn.dataset.jobsFilter) { ui.jobsFilter = btn.dataset.jobsFilter; render(); return; }
      if (btn.dataset.fuelPeriod) { ui.fuelPeriod = btn.dataset.fuelPeriod; render(); return; }
      if (btn.dataset.setCurrency) { state.settings.currency = btn.dataset.setCurrency; saveState(); render(); return; }
      if (btn.dataset.setDistUnit) { state.settings.distanceUnit = btn.dataset.setDistUnit; saveState(); render(); return; }
      if (btn.dataset.setLang) { state.settings.language = btn.dataset.setLang; saveState(); render(); return; }
      if (btn.dataset.setTheme) { state.settings.theme = btn.dataset.setTheme; saveState(); render(); return; }

      if (btn.dataset.stopRunning) { stopJobTimer(btn.dataset.stopRunning); return; }
      if (btn.dataset.openRunning) { openJobModal(btn.dataset.openRunning); return; }
      if (btn.dataset.startJob) { startJobTimer(btn.dataset.startJob, 'site'); return; }
      if (btn.dataset.stopJob) { stopJobTimer(btn.dataset.stopJob); return; }
      if (btn.dataset.arrivedJob) { arrivedAtJob(btn.dataset.arrivedJob); return; }
      if (btn.dataset.finishJob) { finishJobAction(btn.dataset.finishJob); return; }
      if (btn.dataset.markPaid) {
        const j = state.jobs.find(x => x.id === btn.dataset.markPaid);
        if (j) {
          j.received = jobHasPrice(j) ? round2(j.paid) : 0;
          saveState();
          render();
          showToast(t('jobSaved'));
        }
        return;
      }
      if (btn.dataset.jobMenu) { openJobCardMenu(btn.dataset.jobMenu); return; }
      if (btn.dataset.openMap) { openMapChooser(btn.dataset.openMap); return; }
      if (btn.dataset.openCustomer) {
        ui.selectedCustomerId = btn.dataset.openCustomer;
        ui.customerJobsSearch = '';
        try { history.pushState({ jlCust: true }, ''); } catch (err) {}
        render();
        window.scrollTo(0, 0);
        return;
      }
      if (btn.dataset.editProduct) { openProductModal(btn.dataset.editProduct); return; }
      if (btn.dataset.editFuel) { openFuelModal(btn.dataset.editFuel); return; }
      if (btn.dataset.editMileage) { openMileageModal(btn.dataset.editMileage); return; }
      if (btn.dataset.openJob) { openJobModal(btn.dataset.openJob); return; }
      if (btn.dataset.cardJob) { openJobModal(btn.dataset.cardJob); return; }
    });

    document.getElementById('fab-new-job').onclick = () => openJobModal(null);

    // Boot
    if (typeof window !== 'undefined' && window.location && (window.location.protocol === 'http:' || window.location.protocol === 'https:')) {
      try {
        if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
          navigator.serviceWorker.getRegistrations().then(regs => { regs.forEach(r => r.unregister()); }).catch(() => {});
        }
        if (window.caches && caches.keys) {
          caches.keys().then(ks => { ks.forEach(k => caches.delete(k)); }).catch(() => {});
        }
      } catch (e) {}
    }
    loadState();
    applyThemeAndLang();
    render();
    if (state.settings.pinHash) {
      pinLocked = true;
      showPinPad('unlock', () => checkOver12hTimer());
    } else {
      checkOver12hTimer();
    }
  })();
  </script>
</body>
</html>
